plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.d424booktracker'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.example.d424booktracker"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    implementation libs.recyclerview
    implementation libs.room.common.jvm
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
    // Room components
    implementation("androidx.room:room-runtime:${rootProject.ext.get("roomVersion")}")
    annotationProcessor("androidx.room:room-compiler:${rootProject.ext.get("roomVersion")}")
    androidTestImplementation("androidx.room:room-testing:${rootProject.ext.get("roomVersion")}")
}